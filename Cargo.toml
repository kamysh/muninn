[workspace]
members = ["crates/core", "crates/indexer", "crates/mcp", "crates/cli"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.53.3", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
kryzhen = { git = "https://github.com/kamysh/kryzhen", tag = "v2.0.2" }
include_dir = "0.7.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.8.23"
toml_edit = "0.22.27"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
futures = "0.3.34"
tree-sitter = "0.22.6"
tree-sitter-rust = "0.21.2"
tree-sitter-python = "0.21.0"
tree-sitter-javascript = "0.21.4"
tree-sitter-typescript = "0.21.2"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
ignore = "0.4.33"
url = "2.5.8"
sha2 = "0.10.9"
