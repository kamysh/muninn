[workspace]
members = ["crates/core", "crates/indexer", "crates/mcp", "crates/cli"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
futures = "0.3"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
quickcheck = "1"
quickcheck_macros = "1"
ignore = "0.4"
url = "2"
# Pin ort-sys to the exact version whose ABI matches the Pyke prebuilt
# pinned in flake.nix (pykeVersion = "1.24.2" → rc.12 ABI). Declared here
# as a workspace dep and pulled into muninn-core directly so Cargo's
# resolver enforces the exact version — fastembed's loose `ort-sys =
# "2.0.0-rc"` bound otherwise lets `cargo update` bump it silently. The
# binary then links the old-ABI libonnxruntime.a but calls
# Ort_GetApi(NEWER_VERSION) at runtime, gets null, and panics with
# "Failed to initialize ORT API". Bumping requires editing both this pin
# AND flake.nix's pykeVersion in lockstep — drift is visible in code
# review.
ort-sys = "=2.0.0-rc.12"