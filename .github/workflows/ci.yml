name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Rust format
        run: nix develop --command cargo fmt --all -- --check
      - name: Rust lint
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust unit tests
        # The disposable-database integration suite (crates/core/tests) needs
        # the postgres-ai harness and runs locally via muninn-setup/test-all.sh.
        run: nix develop --command cargo test --workspace --lib --bins
      - name: Agda aggregate
        run: nix develop --command sh -c 'cd spec && agda Muninn.agda'
      - name: Catalog checkers
        run: |
          python3 scripts/check_mcp_catalog.py
          (cd scripts && python3 check_cli_catalog.py)
          (cd scripts && python3 check_daemon_catalog.py)
          python3 scripts/check_record_correspondence.py
          python3 scripts/check_crash_boundaries.py
      - name: Checker tests
        run: python3 -m unittest discover -s tests
