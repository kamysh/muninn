name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
          - runner: macos-latest
            artifact: darwin-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          flakehub: false

      - name: Build
        run: nix build .#muninn-static

      # macOS 26 taskgated rejects the linker-emitted adhoc signature on the
      # MCP binaries (SIGKILL at exec, "Taskgated Invalid Signature") even
      # though codesign --verify passes. Re-sign with Apple's codesign and
      # smoke-execute each binary: exec is the only check that catches it.
      - name: Re-sign and smoke-test darwin binaries
        if: matrix.artifact == 'darwin-arm64'
        run: |
          mkdir -p bin-dist
          cp result/bin/muninn result/bin/muninn-index result/bin/muninn-mcp bin-dist/
          codesign --force --sign - bin-dist/muninn bin-dist/muninn-index bin-dist/muninn-mcp
          codesign --verify --strict bin-dist/muninn bin-dist/muninn-index bin-dist/muninn-mcp
          bin-dist/muninn --version
          bin-dist/muninn-index --version
          bin-dist/muninn-mcp --version

      - name: Package
        run: |
          pkg_dir=result/bin
          [ "${{ matrix.artifact }}" = darwin-arm64 ] && pkg_dir=bin-dist
          tar -czf muninn-${{ matrix.artifact }}.tar.gz \
            -C "$pkg_dir" \
            muninn muninn-index muninn-mcp

      - uses: actions/upload-artifact@v4
        with:
          name: muninn-${{ matrix.artifact }}
          path: muninn-${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # publish the release + assets
      actions: write    # delete superseded Actions artifacts (prune step)

    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            muninn-linux-amd64/muninn-linux-amd64.tar.gz
            muninn-linux-arm64/muninn-linux-arm64.tar.gz
            muninn-darwin-arm64/muninn-darwin-arm64.tar.gz

      # Keep only THIS release's per-platform binaries as Actions artifacts.
      # The distributable binaries live on the GitHub Release (published above)
      # and on Release assets uploaded separately (e.g. darwin-amd64) — those
      # are NOT Actions artifacts and are untouched here. This step deletes
      # every Actions artifact from a PRIOR run, so exactly one latest binary
      # per platform remains and Actions storage does not grow unbounded.
      - name: Prune superseded Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Keeping artifacts from run ${{ github.run_id }}; deleting older ones."
          gh api --paginate \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' \
          | while read -r id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done
