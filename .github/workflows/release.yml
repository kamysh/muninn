name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-latest
            target: darwin-arm64
          - runner: macos-13
            target: darwin-amd64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          flakehub: false

      - name: Build
        run: nix build .#muninn-static

      - name: Package
        run: |
          tar -czf muninn-${{ matrix.target }}.tar.gz \
            -C result/bin \
            muninn muninn-index muninn-mcp

      - uses: actions/upload-artifact@v4
        with:
          name: muninn-${{ matrix.target }}
          path: muninn-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            muninn-linux-amd64/muninn-linux-amd64.tar.gz
            muninn-linux-arm64/muninn-linux-arm64.tar.gz
            muninn-darwin-arm64/muninn-darwin-arm64.tar.gz
            muninn-darwin-amd64/muninn-darwin-amd64.tar.gz
