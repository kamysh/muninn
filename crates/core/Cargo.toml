[package]
name = "muninn-core"
version = "0.9.3"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio-postgres = { workspace = true }
postgres-native-tls = { workspace = true }
native-tls = { workspace = true }
kryzhen = { workspace = true }
include_dir = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
ignore = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
# Local embedding backend: model2vec static embeddings (pure Rust — no ONNX
# runtime, no native ML lib, no ABI/version pinning). `fancy-regex` instead of
# the default `onig` keeps the tokenizer dependency pure-Rust (no oniguruma C).
model2vec-rs = { version = "0.2", default-features = false, features = ["hf-hub", "fancy-regex"] }
pgvector = { version = "0.4.2", features = ["postgres"] }
sha2 = { workspace = true }

[dev-dependencies]
quickcheck = { workspace = true }
quickcheck_macros = { workspace = true }
tempfile = "3"
futures = { workspace = true }
