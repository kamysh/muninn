[package]
name = "muninn-core"
version = "0.1.14"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
sqlx = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
ignore = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
fastembed = { version = "5.13", default-features = false, features = [
  "hf-hub",
  "hf-hub-native-tls",
  "ort-download-binaries-native-tls",
] }
# Direct pin on fastembed's transitive ort-sys dep — see workspace Cargo.toml
# for the rationale. The crate itself isn't used in muninn-core code; the
# direct dep is solely to force the resolver to pick the pinned version.
ort-sys = { workspace = true }

[dev-dependencies]
quickcheck = { workspace = true }
quickcheck_macros = { workspace = true }
tempfile = "3"
